<section class="hero-section">
  <div class="container d-flex flex-column align-items-center justify-content-center text-center">
    <div class="hero-card">
      <h1 class="hero-title">Bienvenido a GoodJobs Employed</h1>
      <p class="hero-subtitle">
        Sistema de seguimiento y gestión de perfiles profesionales
      </p>
      <div class="d-flex flex-column flex-sm-row justify-content-center gap-3 mt-4">
        <a routerLink="/perfiles" class="btn-apple btn-primary-custom text-decoration-none">
          Ver Perfiles
        </a>
        <a routerLink="/perfiles" [queryParams]="{ crear: 'true' }" class="btn-apple btn-secondary-custom text-decoration-none">
          Agregar Perfiles
        </a>
      </div>
    </div>
  </div>
</section>
